<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h4>Student Registration Form</h4>
    <table border="0" cellpadding="5"></table>
    <tr>
        <td><label for="roll">Roll Number:</label></td>
        <td><input type="text" id="roll" name="roll" required></td>
    </tr>
    <br>
        <tr>
            <td><label>student name </label></td>
            <td><input type="text" name="first_name" placeholder="First Name" required></td>
            <td><input type="text" name="last_name" placeholder="Last Name" required></td>
        </tr>
    </br>  
<br>
        <tr>
            <td><label>Father's name </label></td>
            <td><input type="text" name="father_name" placeholder="Father's Name" required></td>
        </tr>
    </br>
  <br>
        <tr>
            <td><label>Date of Birth </label></td>
            <td><input type="date" name="dob" required></td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Mobile Number </label></td>
            <td><input type="text" name="mobile" placeholder="Mobile Number" required></td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Email id</label></td>
            <td><input type="email" name="email" placeholder="Email Address" required></td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Password </label></td>
            <td><input type="password" name="password" placeholder="Password" required></td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Gender </label></td>
            <td><input type="radio" name="gender" value="male" required> Male
                <input type="radio" name="gender" value="female" required> Female</td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Department </label></td>
            <td><input type="checkbox" name="department"value="cse"  required> Computer Science
                <input type="checkbox" name="department" value="it" required> Information Technology
                <input type="checkbox" name="department" value="ece" required> Electronics and Communication
                <input type="checkbox" name="department" value="ee" required> civil Engineering
            <input type="checkbox" name="department" value="me" required> Mechanical Engineering</td>
        </tr>
    </br>
    <br>
        <tr>
            <td><label>Student photo </label></td>
            <td><input type="file" name="photo" accept="image/*" required></td>
        </tr>
        </br>
        <br>
        <tr>
            <td><label>City </label></td>
            <td><input type="text" name="city"  required></td>
        </tr>
    </br>
    <br>
        <tr>
            
            <td><label>Address:</label></td>  
            <td><input type="text" name="state" style="width: 120px; height: 45px; resize: none;" required></td>
        </tr>

</body>
</html>
