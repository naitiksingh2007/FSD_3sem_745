<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: Arial, sans-serif; background: #f6efe4; color: #392b32; }
    .container { max-width: 950px; margin: auto; }
    header { padding: 28px; background: #702d46; color: #fffaf2; border: 2px solid #502036; border-radius: 12px; margin-bottom: 24px; box-shadow: 5px 5px 0 #d6b679; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    header p { margin: 0; line-height: 1.5; color: #f4dfd5; }
    .card { background: #fffdf8; padding: 26px; border: 2px solid #c7a77b; border-radius: 12px; margin-bottom: 24px; box-shadow: 4px 4px 0 #e8d8bf; }
    h2 { margin-top: 0; font-size: 21px; color: #702d46; border-bottom: 2px solid #e8d8bf; padding-bottom: 12px; }
    .fields { display: flex; gap: 16px; margin-bottom: 20px; }
    label { flex: 1; font-size: 14px; font-weight: bold; }
    input { width: 100%; padding: 12px; background: #fffdf8; color: #392b32; border: 2px solid #c7a77b; border-radius: 6px; margin-top: 8px; font: inherit; font-weight: normal; }
    input:focus { outline: 2px solid #702d46; outline-offset: 2px; }
    button { background: #702d46; color: #fffaf2; border: 2px solid #502036; border-radius: 6px; padding: 11px 16px; cursor: pointer; font: inherit; margin: 3px 5px 3px 0; }
    button:hover { filter: brightness(0.9); }
    button:focus-visible { outline: 3px solid #997134; outline-offset: 3px; }
    .secondary { background: #f4e5c9; color: #583e26; border-color: #a7814e; }
    .delete { background: #a53636; border-color: #7e2424; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; border: 2px solid #c7a77b; }
    th, td { text-align: left; padding: 14px 12px; border: 1px solid #dfcdb2; }
    th { background: #f4e5c9; color: #583e26; font-size: 14px; }
    tbody tr:nth-child(even) { background: #fbf4e8; }
    td button { font-size: 13px; padding: 8px 12px; }
    #message { min-height: 20px; margin: 14px 0 0; color: #702d46; line-height: 1.5; }
    .empty { text-align: center; padding: 26px; color: #78634f; border: 2px dashed #c7a77b; border-radius: 6px; background: #fbf4e8; }
    footer { text-align: center; font-size: 13px; color: #78634f; }
    @media (max-width: 650px) { .fields { flex-direction: column; } body { padding: 20px 12px; } .card, header { padding: 20px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Library Management System</h1>
    <p>Add, view, update and delete books in your library.</p>
  </header>

  <div class="card">
    <h2 id="formTitle">Add a Book</h2>
    <div class="fields">
      <label for="title">Book Title<input id="title" placeholder="Enter book title"></label>
      <label for="author">Author<input id="author" placeholder="Enter author name"></label>
      <label for="category">Category<input id="category" placeholder="e.g. Fiction, Science"></label>
    </div>
    <button id="addButton" onclick="addBook()">Add Book</button>
    <button id="updateButton" onclick="updateBook()" hidden>Update Book</button>
    <button id="cancelButton" class="secondary" onclick="clearInputs()" hidden>Cancel</button>
    <button class="secondary" onclick="showBooks()">Show Books</button>
    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <div class="card">
    <h2>Books</h2>
    <div id="data" class="table-wrap"></div>
  </div>
  <footer>Library Management • Assignment 2</footer>
</div>

<script>
let selectedId = null;
let books = [];

function getBookDetails() {
  return {
    title: document.getElementById("title").value.trim(),
    author: document.getElementById("author").value.trim(),
    category: document.getElementById("category").value.trim()
  };
}

function validBook(book) {
  if (!book.title || !book.author || !book.category) {
    document.getElementById("message").textContent = "Please fill in all three fields.";
    return false;
  }
  return true;
}

function clearInputs() {
  document.getElementById("title").value = "";
  document.getElementById("author").value = "";
  document.getElementById("category").value = "";
  selectedId = null;
  document.getElementById("formTitle").textContent = "Add a Book";
  document.getElementById("addButton").hidden = false;
  document.getElementById("updateButton").hidden = true;
  document.getElementById("cancelButton").hidden = true;
  document.getElementById("message").textContent = "";
}

async function addBook() {
  const book = getBookDetails();
  if (!validBook(book)) return;

  try {
    const response = await fetch("/books", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(book)
    });
    if (!response.ok) throw new Error(await response.text());

    clearInputs();
    await showBooks();
    document.getElementById("message").textContent = "Book added successfully!";
  } catch (error) {
    document.getElementById("message").textContent = "Unable to add book: " + error.message;
  }
}

// Escape user input so book details are displayed as text.
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

async function showBooks() {
  const dataContainer = document.getElementById("data");

  try {
    const response = await fetch("/books");
    if (!response.ok) throw new Error("Failed to fetch books");
    books = await response.json();

    if (books.length === 0) {
      dataContainer.innerHTML = '<p class="empty">No books yet. Add your first book above.</p>';
      return;
    }

    dataContainer.innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody>${books.map(item => `
          <tr>
            <td>${item.id}</td>
            <td>${escapeHTML(item.title)}</td>
            <td>${escapeHTML(item.author)}</td>
            <td>${escapeHTML(item.category)}</td>
            <td>
              <button onclick="editBook(${item.id})">Edit</button>
              <button class="delete" onclick="deleteBook(${item.id})">Delete</button>
            </td>
          </tr>
        `).join("")}</tbody>
      </table>`;
  } catch (error) {
    dataContainer.textContent = "Unable to load books. Check that the server is running and click Show Books to retry.";
  }
}

function editBook(id) {
  const book = books.find(item => item.id === id);
  if (!book) return;
  selectedId = id;
  document.getElementById("title").value = book.title;
  document.getElementById("author").value = book.author;
  document.getElementById("category").value = book.category;
  document.getElementById("formTitle").textContent = "Update Book #" + id;
  document.getElementById("addButton").hidden = true;
  document.getElementById("updateButton").hidden = false;
  document.getElementById("cancelButton").hidden = false;
  document.getElementById("message").textContent = "Edit the details and click Update Book.";
  document.getElementById("title").focus();
}

async function updateBook() {
  if (selectedId === null) return;
  const book = getBookDetails();
  if (!validBook(book)) return;

  try {
    const response = await fetch("/books/" + selectedId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(book)
    });
    if (!response.ok) throw new Error(await response.text());

    clearInputs();
    await showBooks();
    document.getElementById("message").textContent = "Book updated successfully!";
  } catch (error) {
    document.getElementById("message").textContent = "Unable to update book: " + error.message;
  }
}

async function deleteBook(id) {
  if (!confirm("Delete this book?")) return;

  try {
    const response = await fetch("/books/" + id, { method: "DELETE" });
    if (!response.ok) throw new Error(await response.text());

    if (selectedId === id) clearInputs();
    await showBooks();
    document.getElementById("message").textContent = "Book deleted successfully!";
  } catch (error) {
    document.getElementById("message").textContent = "Unable to delete book: " + error.message;
  }
}

showBooks();
</script>
</body>
</html>
